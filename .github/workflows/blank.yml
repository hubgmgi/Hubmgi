name: RDP

on:
  workflow_dispatch:

permissions:
  actions: write   # lets the job re-dispatch itself with GITHUB_TOKEN

# next run waits in queue until this one ends (same hostname, no overlap)
concurrency:
  group: rdp
  cancel-in-progress: false

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360   # hard max for GitHub-hosted runners

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          # admins elevate without a UAC prompt (so the installer window can self-elevate)
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' `
                             -Name "ConsentPromptBehaviorAdmin" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          # only allow Tailscale range (100.64.0.0/10), not the open internet
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10

          Restart-Service -Name TermService -Force

      - name: Create RDP User
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $securePass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Remove stale gh-rdp nodes
        continue-on-error: true
        env:
          TS_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          $tok = (Invoke-RestMethod -Method Post -Uri "https://api.tailscale.com/api/v2/oauth/token" `
              -Body @{ client_id = $env:TS_ID; client_secret = $env:TS_SECRET; grant_type = "client_credentials" }).access_token
          $h = @{ Authorization = "Bearer $tok" }
          $devs = (Invoke-RestMethod -Uri "https://api.tailscale.com/api/v2/tailnet/-/devices" -Headers $h).devices
          foreach ($d in $devs) {
              if ($d.name -like "gh-rdp*") {
                  Write-Host "Deleting stale node: $($d.name)"
                  Invoke-RestMethod -Method Delete -Uri "https://api.tailscale.com/api/v2/device/$($d.id)" -Headers $h | Out-Null
              }
          }

      - name: Connect Tailscale (OAuth)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: gh-rdp

      - name: Get Tailscale IP
        run: |
          $ts = (Get-Command tailscale -ErrorAction SilentlyContinue).Source
          if (-not $ts) { $ts = "$env:ProgramFiles\Tailscale\tailscale.exe" }

          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & $ts ip -4
              if (-not $tsIP) { Start-Sleep -Seconds 5 }
              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          echo "TS_BIN=$ts" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Install IDA Pro (optional, needs secrets)
        continue-on-error: true
        env:
          IDA_URL: ${{ secrets.IDA_URL }}
          IDA_INSTALL_PASSWORD: ${{ secrets.IDA_INSTALL_PASSWORD }}
          IDA_LICENSE: ${{ secrets.IDA_LICENSE }}
        run: |
          if (-not $env:IDA_URL) { Write-Host "IDA_URL not set, skipping IDA"; exit 0 }

          Invoke-WebRequest $env:IDA_URL -OutFile "$env:TEMP\ida-installer.exe"

          $args = @("--mode","unattended","--prefix","C:\IDA")
          if ($env:IDA_INSTALL_PASSWORD) { $args += @("--installpassword",$env:IDA_INSTALL_PASSWORD) }
          Start-Process "$env:TEMP\ida-installer.exe" -ArgumentList $args -Wait

          $exe = Get-ChildItem C:\IDA -Recurse -Filter ida.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Error "ida.exe not found after install"; exit 1 }

          if ($env:IDA_LICENSE) {
              [IO.File]::WriteAllText((Join-Path $exe.DirectoryName "idapro.hexlic"), $env:IDA_LICENSE, (New-Object Text.UTF8Encoding $false))
          }

          $s = (New-Object -ComObject WScript.Shell).CreateShortcut("C:\Users\Public\Desktop\IDA Pro.lnk")
          $s.TargetPath = $exe.FullName
          $s.WorkingDirectory = $exe.DirectoryName
          $s.Save()

      - name: Create Tools Installer + Desktop Icon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force C:\Tools | Out-Null

          $script = @'
          param([switch]$Unattended)
          $ErrorActionPreference = "Continue"
          $ProgressPreference = "SilentlyContinue"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          # self-elevate (no UAC prompt on this machine)
          $isAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          if (-not $isAdmin -and -not $Unattended) {
              Start-Process powershell -Verb RunAs -ArgumentList "-NoExit -ExecutionPolicy Bypass -File `"$PSCommandPath`""
              exit
          }

          $h = @{ "User-Agent" = "rdp-setup"; Authorization = "Bearer __TOKEN__" }
          function Open-Url($u) { if (-not $Unattended) { Start-Process $u } }
          function Get-Json($url) {
              try { return Invoke-RestMethod $url -Headers $h }
              catch { return Invoke-RestMethod $url -Headers @{ "User-Agent" = "rdp-setup" } }
          }

          Write-Host "=== 1/4 Python ===" -ForegroundColor Cyan
          choco install python311 -y --no-progress

          Write-Host "=== 2/4 Ghidra + GhidraMCP ===" -ForegroundColor Cyan
          $ghidraReady = $false
          try {
              $mcp = Get-Json "https://api.github.com/repos/LaurieWired/GhidraMCP/releases/latest"
              $asset = $mcp.assets | Where-Object { $_.name -like "*.zip" } | Select-Object -First 1
              Invoke-WebRequest $asset.browser_download_url -OutFile "$env:TEMP\mcp.zip"
              Expand-Archive "$env:TEMP\mcp.zip" -DestinationPath "$env:TEMP\mcp" -Force

              $plugin = Get-ChildItem "$env:TEMP\mcp" -Recurse -Filter "GhidraMCP*.zip" | Select-Object -First 1
              if (-not $plugin) { $plugin = Get-Item "$env:TEMP\mcp.zip" }
              $bridge = Get-ChildItem "$env:TEMP\mcp" -Recurse -Filter "bridge_mcp_ghidra.py" | Select-Object -First 1

              New-Item -ItemType Directory -Force C:\Tools\GhidraMCP | Out-Null
              if ($bridge) { Copy-Item $bridge.FullName C:\Tools\GhidraMCP\ -Force }
              else { Invoke-WebRequest "https://raw.githubusercontent.com/LaurieWired/GhidraMCP/main/bridge_mcp_ghidra.py" -OutFile C:\Tools\GhidraMCP\bridge_mcp_ghidra.py }

              # install the Ghidra version the plugin was built for
              Expand-Archive $plugin.FullName -DestinationPath "$env:TEMP\plug" -Force
              $props = Get-ChildItem "$env:TEMP\plug" -Recurse -Filter "extension.properties" | Select-Object -First 1
              $ver = $null
              if ($props) { $ver = (Select-String -Path $props.FullName -Pattern '^version=(.+)$').Matches[0].Groups[1].Value.Trim() }
              Write-Host "Plugin targets Ghidra: $ver"

              $dir = (Get-ChildItem C:\Tools -Directory -Filter "ghidra_*" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
              if (-not $dir) {
                  try { $g = Get-Json "https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/tags/Ghidra_${ver}_build" }
                  catch { $g = Get-Json "https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest" }
                  $ga = $g.assets | Where-Object { $_.name -like "ghidra_*_PUBLIC_*.zip" } | Select-Object -First 1
                  Invoke-WebRequest $ga.browser_download_url -OutFile "$env:TEMP\ghidra.zip"
                  Expand-Archive "$env:TEMP\ghidra.zip" -DestinationPath "C:\Tools" -Force
                  $dir = (Get-ChildItem C:\Tools -Directory -Filter "ghidra_*" | Select-Object -First 1).FullName
              }
              Expand-Archive $plugin.FullName -DestinationPath "$dir\Ghidra\Extensions" -Force

              # pinned to 25 on purpose — not derived from Ghidra's application.properties floor.
              # Ghidra only needs 21+; this installs Temurin 25 specifically regardless of that floor.
              $jmin = 25
              Write-Host "Installing JDK $jmin (pinned)"

              # --- Primary: official Temurin MSI installer (matches https://adoptium.net/download) ---
              $installDir = "C:\Tools\jdk\jdk-$jmin"
              $jdk = if (Test-Path "$installDir\bin\java.exe") { $installDir } else { $null }
              if (-not $jdk) {
                  try {
                      $assets = Invoke-RestMethod "https://api.adoptium.net/v3/assets/latest/$jmin/hotspot?image_type=jdk&os=windows&architecture=x64&vendor=eclipse"
                      $release = $assets | Where-Object { $_.binary.installer } | Select-Object -First 1
                      if (-not $release) { throw "No GA Windows x64 MSI installer published for feature version $jmin yet" }

                      $msiUrl  = $release.binary.installer.link
                      $msiHash = $release.binary.installer.checksum
                      $msiPath = "$env:TEMP\temurin-jdk$jmin.msi"
                      Write-Host "Fetching $msiUrl"
                      Invoke-WebRequest -Uri $msiUrl -OutFile $msiPath -UseBasicParsing

                      if ($msiHash) {
                          $actualHash = (Get-FileHash $msiPath -Algorithm SHA256).Hash
                          if ($actualHash -ne $msiHash.ToUpper()) { throw "SHA-256 mismatch: expected $msiHash, got $actualHash" }
                          Write-Host "Checksum verified OK" -ForegroundColor Green
                      }

                      New-Item -ItemType Directory -Force $installDir | Out-Null
                      $logPath = "$env:TEMP\jdk$jmin-install.log"
                      # FeatureJavaHome is NOT part of the common INSTALLLEVEL=1 one-liner — must be named explicitly
                      # or JAVA_HOME never gets set and every downstream step that relies on it silently breaks.
                      $msiArgs = @(
                          "/i", "`"$msiPath`"",
                          "/quiet", "/norestart",
                          "ADDLOCAL=FeatureMain,FeatureEnvironment,FeatureJarFileRunWith,FeatureJavaHome",
                          "INSTALLDIR=`"$installDir`"",
                          "/l*v", "`"$logPath`""
                      )
                      $proc = Start-Process msiexec.exe -ArgumentList $msiArgs -Wait -PassThru
                      if ($proc.ExitCode -notin 0, 3010) {
                          $tail = if (Test-Path $logPath) { (Get-Content $logPath -Tail 40) -join "`n" } else { "(no msi log found)" }
                          throw "msiexec exited $($proc.ExitCode).`n--- tail of $logPath ---`n$tail"
                      }
                      Write-Host "MSI install exit code $($proc.ExitCode) (0=ok, 3010=ok-reboot-pending)" -ForegroundColor Green
                  } catch { Write-Host "Temurin MSI install failed: $_" -ForegroundColor Yellow }
                  $jdk = if (Test-Path "$installDir\bin\java.exe") { $installDir } else { $null }
              }

              # --- Fallback 1: raw zip archive from the same API family ---
              if (-not $jdk) {
                  try {
                      $apiUrl = "https://api.adoptium.net/v3/binary/latest/$jmin/ga/windows/x64/jdk/hotspot/normal/eclipse"
                      $probe = Invoke-WebRequest -Uri $apiUrl -MaximumRedirection 0 -ErrorAction SilentlyContinue -UseBasicParsing
                      $fetchUrl = if ($probe -and $probe.Headers.Location) { $probe.Headers.Location } else { $apiUrl }
                      $resp = Invoke-WebRequest -Uri $fetchUrl -OutFile "$env:TEMP\jdk.zip" -PassThru -UseBasicParsing
                      if ($resp.StatusCode -ne 200 -or (Get-Item "$env:TEMP\jdk.zip").Length -lt 1MB) {
                          throw "Adoptium returned status $($resp.StatusCode) or a truncated archive"
                      }
                      Expand-Archive "$env:TEMP\jdk.zip" -DestinationPath C:\Tools\jdk -Force
                  } catch { Write-Host "Adoptium zip fallback failed: $_" -ForegroundColor Yellow }
                  $jdk = (Get-ChildItem C:\Tools\jdk -Directory -Filter "jdk-$jmin*" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
              }

              # --- Fallback 2: chocolatey ---
              if (-not $jdk) {
                  Write-Host "Falling back to choco for temurin$jmin..." -ForegroundColor Yellow
                  choco install "temurin$jmin" -y --no-progress
                  $jdk = (Get-ChildItem "C:\Program Files\Eclipse Adoptium" -Directory -Filter "jdk-$jmin*" -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1).FullName
              }
              if (-not $jdk -or -not (Test-Path "$jdk\bin\java.exe")) {
                  throw "Could not install JDK $jmin — Ghidra and the MCP bridge cannot proceed without it"
              }

              # proof of life — don't trust the directory exists, prove java actually runs
              & "$jdk\bin\java.exe" -version
              if ($LASTEXITCODE -ne 0) { throw "Installed JDK at $jdk failed to execute (-version exited $LASTEXITCODE)" }
              Write-Host "Using JDK: $jdk" -ForegroundColor Green

              [Environment]::SetEnvironmentVariable("JAVA_HOME", $jdk, "Machine")
              $env:JAVA_HOME = $jdk   # make it usable in *this* process immediately, not just future shells
              $env:Path = "$jdk\bin;$env:Path"

              # make ghidraRun.bat itself always use this JDK (works no matter how Ghidra is opened)
              $lp = Join-Path $dir "support\launch.properties"
              $jdkFwd = $jdk -replace '\\','/'
              $lines = @(Get-Content $lp)
              if ($lines -match '^\s*#?\s*JAVA_HOME_OVERRIDE=') {
                  $lines = $lines -replace '^\s*#?\s*JAVA_HOME_OVERRIDE=.*$', "JAVA_HOME_OVERRIDE=$jdkFwd"
              } else {
                  $lines += "JAVA_HOME_OVERRIDE=$jdkFwd"
              }
              Set-Content -Path $lp -Value $lines
              Write-Host "launch.properties -> JAVA_HOME_OVERRIDE=$jdkFwd"

              # launcher sets JAVA_HOME itself (this desktop session still has the runner's old Java 17)
              $s = (New-Object -ComObject WScript.Shell).CreateShortcut("C:\Users\Public\Desktop\Ghidra.lnk")
              $s.TargetPath = "cmd.exe"
              $s.Arguments = '/c set "JAVA_HOME=' + $jdk + '" && "' + $dir + '\ghidraRun.bat"'
              $s.WorkingDirectory = $dir
              $s.Save()
              Write-Host "Ghidra OK" -ForegroundColor Green
              $ghidraReady = $true
          } catch { Write-Host "Ghidra step failed: $_" -ForegroundColor Red }

          Write-Host "=== 3/4 MCP bridge + WorkBuddy config ===" -ForegroundColor Cyan
          if (-not $ghidraReady) {
              Write-Host "Skipping MCP bridge — Ghidra/JDK did not come up clean, nothing for it to bridge to." -ForegroundColor Yellow
          } else {
          try {
              & C:\Python311\python.exe -m pip install --quiet mcp requests
              $cfg = @{ mcpServers = @{ ghidra = @{
                  command = "C:\Python311\python.exe"
                  args    = @("C:\Tools\GhidraMCP\bridge_mcp_ghidra.py", "--ghidra-server", "http://127.0.0.1:8080/")
              } } } | ConvertTo-Json -Depth 6
              foreach ($home_ in @($env:USERPROFILE, "C:\Users\Default")) {
                  New-Item -ItemType Directory -Force "$home_\.workbuddy" | Out-Null
                  [IO.File]::WriteAllText("$home_\.workbuddy\mcp.json", $cfg, (New-Object Text.UTF8Encoding $false))
              }
              Write-Host "MCP config OK" -ForegroundColor Green
          } catch { Write-Host "MCP step failed: $_" -ForegroundColor Red }
          }

          Write-Host "=== 4/4 WorkBuddy ===" -ForegroundColor Cyan
          try {
              $env:Path = [Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [Environment]::GetEnvironmentVariable("Path","User") + ";$env:LOCALAPPDATA\Microsoft\WindowsApps"
              if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
                  Install-PackageProvider NuGet -Force | Out-Null
                  Install-Module Microsoft.WinGet.Client -Force -Repository PSGallery | Out-Null
                  Repair-WinGetPackageManager -AllUsers
                  $env:Path = [Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [Environment]::GetEnvironmentVariable("Path","User") + ";$env:LOCALAPPDATA\Microsoft\WindowsApps"
              }
              if (Get-Command winget -ErrorAction SilentlyContinue) {
                  winget install --id Tencent.WorkBuddy --exact --silent --accept-package-agreements --accept-source-agreements
              } else {
                  Write-Host "winget not available - opening the WorkBuddy download page instead" -ForegroundColor Yellow
                  Open-Url "https://www.workbuddy.ai/"
              }
          } catch {
              Write-Host "WorkBuddy step failed: $_" -ForegroundColor Red
              Open-Url "https://www.workbuddy.ai/"
          }

          try {
              $wbDirs = Get-ChildItem "C:\Users\*\AppData\Local\Programs","C:\Program Files","C:\Program Files (x86)" -Directory -Filter "*WorkBuddy*" -ErrorAction SilentlyContinue
              $wbExe = $wbDirs | ForEach-Object { Get-ChildItem $_.FullName -Filter "WorkBuddy*.exe" -ErrorAction SilentlyContinue } | Select-Object -First 1
              if ($wbExe) {
                  $s = (New-Object -ComObject WScript.Shell).CreateShortcut("C:\Users\Public\Desktop\WorkBuddy.lnk")
                  $s.TargetPath = $wbExe.FullName
                  $s.WorkingDirectory = $wbExe.DirectoryName
                  $s.Save()
                  Write-Host "WorkBuddy shortcut created" -ForegroundColor Green
              }
          } catch { Write-Host "WorkBuddy shortcut failed: $_" -ForegroundColor Red }

          Write-Host ""
          Write-Host "DONE. Open Ghidra from the desktop icon." -ForegroundColor Green
          if (-not $Unattended) { Read-Host "Press Enter to close" }
          '@

          $script = $script.Replace('__TOKEN__', $env:GH_TOKoperties"
              if (Test-Path $propFile) {
                  $line = Get-Content $propFile | Where-Object { $_ -match '^application\.java\.min=' } | Select-Object -First 1
                  if ($line) {
                      # pull the leading integer only — the field can read "21" or "21 (recommended ...)"
                      $m = [regex]::Match((($line -split '=')[1]).Trim(), '^\d+')
                      if ($m.Success) { $jmin = [int]$m.Value }
                  }
              }
              Write-Host "Ghidra needs JDK $jmin+"

              # download the JDK straight from Adoptium (https://adoptium.net/temurin/releases), no choco dependency
              $jdk = (Get-ChildItem C:\Tools\jdk -Directory -Filter "jdk-$jmin*" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
              if (-not $jdk) {
                  try {
                      # the /binary/latest endpoint 302s to the real asset — resolve it explicitly rather than
                      # trusting -OutFile to follow redirects cleanly on every PowerShell/TLS combo
                      $apiUrl = "https://api.adoptium.net/v3/binary/latest/$jmin/ga/windows/x64/jdk/hotspot/normal/eclipse"
                      $probe = Invoke-WebRequest -Uri $apiUrl -MaximumRedirection 0 -ErrorAction SilentlyContinue -UseBasicParsing
                      $fetchUrl = if ($probe -and $probe.Headers.Location) { $probe.Headers.Location } else { $apiUrl }

                      $resp = Invoke-WebRequest -Uri $fetchUrl -OutFile "$env:TEMP\jdk.zip" -PassThru -UseBasicParsing
                      if ($resp.StatusCode -ne 200 -or -not (Test-Path "$env:TEMP\jdk.zip") -or (Get-Item "$env:TEMP\jdk.zip").Length -lt 1MB) {
                          throw "Adoptium returned status $($resp.StatusCode) or a truncated archive"
                      }

                      # verify against Adoptium's published checksum before trusting the archive
                      try {
                          $expectedHash = (Invoke-WebRequest "$fetchUrl.sha256.txt" -UseBasicParsing).Content.Split(' ')[0].Trim()
                          $actualHash = (Get-FileHash "$env:TEMP\jdk.zip" -Algorithm SHA256).Hash
                          if ($expectedHash -and $actualHash -ne $expectedHash.ToUpper()) {
                              throw "SHA-256 mismatch: expected $expectedHash, got $actualHash"
                          }
                          Write-Host "Checksum verified OK" -ForegroundColor Green
                      } catch { Write-Host "Checksum verification skipped/failed: $_" -ForegroundColor Yellow }

                      Expand-Archive "$env:TEMP\jdk.zip" -DestinationPath C:\Tools\jdk -Force
                  } catch { Write-Host "Adoptium download failed: $_" -ForegroundColor Yellow }
                  $jdk = (Get-ChildItem C:\Tools\jdk -Directory -Filter "jdk-$jmin*" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
              }
              if (-not $jdk) {
                  Write-Host "Falling back to choco for temurin$jmin..." -ForegroundColor Yellow
                  choco install "temurin$jmin" -y --no-progress
                  $jdk = (Get-ChildItem "C:\Program Files\Eclipse Adoptium" -Directory -Filter "jdk-$jmin*" -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1).FullName
              }
              if (-not $jdk -or -not (Test-Path "$jdk\bin\java.exe")) {
                  throw "Could not install JDK $jmin — Ghidra and the MCP bridge cannot proceed without it"
              }

              # proof of life — don't trust the directory exists, prove java actually runs
              & "$jdk\bin\java.exe" -version
              if ($LASTEXITCODE -ne 0) { throw "Installed JDK at $jdk failed to execute (-version exited $LASTEXITCODE)" }
              Write-Host "Using JDK: $jdk" -ForegroundColor Green

              [Environment]::SetEnvironmentVariable("JAVA_HOME", $jdk, "Machine")
              $env:JAVA_HOME = $jdk   # make it usable in *this* process immediately, not just future shells
              $env:Path = "$jdk\bin;$env:Path"

              # make ghidraRun.bat itself always use this JDK (works no matter how Ghidra is opened)
              $lp = Join-Path $dir "support\launch.properties"
              $jdkFwd = $jdk -replace '\\','/'
              $lines = @(Get-Content $lp)
              if ($lines -match '^\s*#?\s*JAVA_HOME_OVERRIDE=') {
                  $lines = $lines -replace '^\s*#?\s*JAVA_HOME_OVERRIDE=.*$', "JAVA_HOME_OVERRIDE=$jdkFwd"
              } else {
                  $lines += "JAVA_HOME_OVERRIDE=$jdkFwd"
              }
              Set-Content -Path $lp -Value $lines
              Write-Host "launch.properties -> JAVA_HOME_OVERRIDE=$jdkFwd"

              # launcher sets JAVA_HOME itself (this desktop session still has the runner's old Java 17)
              $s = (New-Object -ComObject WScript.Shell).CreateShortcut("C:\Users\Public\Desktop\Ghidra.lnk")
              $s.TargetPath = "cmd.exe"
              $s.Arguments = '/c set "JAVA_HOME=' + $jdk + '" && "' + $dir + '\ghidraRun.bat"'
              $s.WorkingDirectory = $dir
              $s.Save()
              Write-Host "Ghidra OK" -ForegroundColor Green
              $ghidraReady = $true
          } catch { Write-Host "Ghidra step failed: $_" -ForegroundColor Red }

          Write-Host "=== 3/4 MCP bridge + WorkBuddy config ===" -ForegroundColor Cyan
          if (-not $ghidraReady) {
              Write-Host "Skipping MCP bridge — Ghidra/JDK did not come up clean, nothing for it to bridge to." -ForegroundColor Yellow
          } else {
          try {
              & C:\Python311\python.exe -m pip install --quiet mcp requests
              $cfg = @{ mcpServers = @{ ghidra = @{
                  command = "C:\Python311\python.exe"
                  args    = @("C:\Tools\GhidraMCP\bridge_mcp_ghidra.py", "--ghidra-server", "http://127.0.0.1:8080/")
              } } } | ConvertTo-Json -Depth 6
              foreach ($home_ in @($env:USERPROFILE, "C:\Users\Default")) {
                  New-Item -ItemType Directory -Force "$home_\.workbuddy" | Out-Null
                  [IO.File]::WriteAllText("$home_\.workbuddy\mcp.json", $cfg, (New-Object Text.UTF8Encoding $false))
              }
              Write-Host "MCP config OK" -ForegroundColor Green
          } catch { Write-Host "MCP step failed: $_" -ForegroundColor Red }
          }

          Write-Host "=== 4/4 WorkBuddy ===" -ForegroundColor Cyan
          try {
              $env:Path = [Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [Environment]::GetEnvironmentVariable("Path","User") + ";$env:LOCALAPPDATA\Microsoft\WindowsApps"
              if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
                  Install-PackageProvider NuGet -Force | Out-Null
